<!DOCTYPE html><html><head><meta charset="utf-8"><title>decode-test</title></head>
<body>
<input type="file" id="f" multiple accept="image/*">
<button id="go">run</button>
<pre id="out">idle</pre>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
function toCanvas(img,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d',{willReadFrequently:true}).drawImage(img,0,0,w,h);return c;}
function cropC(c,f){const w=Math.round(c.width*f),h=Math.round(c.height*f);const x=Math.round((c.width-w)/2),y=Math.round((c.height-h)/2);const c2=document.createElement('canvas');c2.width=w;c2.height=h;c2.getContext('2d',{willReadFrequently:true}).drawImage(c,x,y,w,h,0,0,w,h);return c2;}
function rotC(c,deg){const rad=deg*Math.PI/180,sw=c.width,sh=c.height;const dw=Math.abs(sw*Math.cos(rad))+Math.abs(sh*Math.sin(rad)),dh=Math.abs(sw*Math.sin(rad))+Math.abs(sh*Math.cos(rad));const c2=document.createElement('canvas');c2.width=Math.round(dw);c2.height=Math.round(dh);const x=c2.getContext('2d',{willReadFrequently:true});x.translate(dw/2,dh/2);x.rotate(rad);x.drawImage(c,-sw/2,-sh/2);return c2;}
function scaleC(c,m){const c2=document.createElement('canvas');c2.width=Math.round(c.width*m);c2.height=Math.round(c.height*m);c2.getContext('2d',{willReadFrequently:true}).drawImage(c,0,0,c2.width,c2.height);return c2;}
function contrastC(c){const c2=document.createElement('canvas');c2.width=c.width;c2.height=c.height;const x=c2.getContext('2d',{willReadFrequently:true});x.drawImage(c,0,0);const d=x.getImageData(0,0,c2.width,c2.height),a=d.data;let mn=255,mx=0;for(let i=0;i<a.length;i+=4){const g=(a[i]*3+a[i+1]*4+a[i+2])/8;if(g<mn)mn=g;if(g>mx)mx=g;}const rng=Math.max(1,mx-mn);for(let i=0;i<a.length;i+=4){const g=(a[i]*3+a[i+1]*4+a[i+2])/8;const v=Math.max(0,Math.min(255,Math.round((g-mn)*255/rng)));a[i]=a[i+1]=a[i+2]=v;}x.putImageData(d,0,0);return c2;}
function variants(img){
  const nw=img.naturalWidth||img.width,nh=img.naturalHeight||img.height;
  const sc=Math.min(1,1800/Math.max(nw,nh));
  const base=toCanvas(img,Math.round(nw*sc),Math.round(nh*sc));
  const out=[{n:'base',c:base}];
  for(const f of [0.7,0.5,0.35])out.push({n:'crop'+f,c:cropC(base,f)});
  out.push({n:'crop35x2',c:scaleC(cropC(base,0.35),2)});
  out.push({n:'contrast',c:contrastC(base)});
  out.push({n:'crop5contrast',c:contrastC(cropC(base,0.5))});
  for(const v of out.slice()){out.push({n:v.n+'-r90',c:rotC(v.c,90)});out.push({n:v.n+'-r180',c:rotC(v.c,180)});out.push({n:v.n+'-r270',c:rotC(v.c,270)});}
  return out;
}
function zxingDecode(c){
  try{
    const hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.DATA_MATRIX,ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.EAN_13]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    const reader=new ZXing.MultiFormatReader();
    reader.setHints(hints);
    const src=new ZXing.HTMLCanvasElementLuminanceSource(c);
    const bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));
    const r=reader.decodeWithState(bmp);
    return r?r.getText():null;
  }catch(e){return null;}
}
async function decodeOne(img){
  const vs=variants(img);
  const log=[];
  if('BarcodeDetector' in window){
    let det=null;
    try{det=new BarcodeDetector({formats:['data_matrix','qr_code','code_128','code_39','ean_13']});}catch(e){}
    if(det){for(const v of vs){try{const codes=await det.detect(v.c);if(codes&&codes[0])return{raw:codes[0].rawValue,engine:'BD',variant:v.n,log};}catch(e){}}}
  }else log.push('no BarcodeDetector');
  for(const v of vs){const r=zxingDecode(v.c);if(r)return{raw:r,engine:'ZXing',variant:v.n,log};}
  return{raw:null,log};
}
document.getElementById('go').onclick=async()=>{
  const out=document.getElementById('out');out.textContent='ZXing loaded: '+(!!window.ZXing)+' BD: '+('BarcodeDetector' in window)+'\n';
  for(const f of document.getElementById('f').files){
    const url=URL.createObjectURL(f);
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const t0=performance.now();
    const r=await decodeOne(img);
    out.textContent+=f.name+' -> '+(r.raw?('OK ['+r.engine+'/'+r.variant+' '+Math.round(performance.now()-t0)+'ms] '+r.raw):'FAIL')+'\n';
  }
  out.textContent+='DONE';
};
</script></body></html>
